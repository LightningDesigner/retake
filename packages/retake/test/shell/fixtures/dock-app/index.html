<!doctype html>
<html><head><meta charset="utf-8"><title>Dock fixture</title>
<style>
  body { font: 14px system-ui; background: #111; color: #eee; margin: 24px; }
  button { font: inherit; padding: 6px 12px; }
  .card { width: 160px; height: 60px; margin: 16px 0; background: #2d6cdf; border-radius: 8px;
    transition: opacity 300ms ease, transform 600ms cubic-bezier(.2,.8,.2,1); }
  .card.off { opacity: .2; transform: translateX(240px); }
  #spin { width: 24px; height: 24px; background: #e3546a; }
  #spin.go { animation: spin 800ms linear 2; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #\:r1\: { padding: 4px; border: 1px dashed #666; }
  /* A loading skeleton: the shimmer is an ::after animation, forever. */
  .skel { position: relative; width: 240px; height: 28px; margin: 12px 0; background: #2a2a2e; border-radius: 6px; overflow: hidden; }
  .skel .title { position: relative; z-index: 1; display: inline-block; padding: 6px 10px; color: #aaa; }
  .skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
    animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
</style></head>
<body>
  <button id="toggle">Toggle</button>
  <button id="spinner">Spin</button>
  <button id="wave">Wave</button>
  <button id="like" aria-label="Like"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 14 2 8a3 3 0 0 1 6-4 3 3 0 0 1 6 4z" fill="currentColor"/></svg></button>
  <form id="f"><input id="q" autocomplete="off" placeholder="type"></form>
  <div class="card primary-card" id="card"></div>
  <div id="spin"></div>
  <div id=":r1:">useId box</div>
  <div id="1st">digit id</div>
  <div class="skel card-skel" id="skel"><span class="title">Loading…</span></div>
  <p id="count">0</p>
  <textarea id="idea" placeholder="Share your idea"></textarea>
  <p id="sent"></p>
  <script type="module" src="/main.js"></script>
</body></html>
