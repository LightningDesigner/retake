<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>States fixture</title>
<link rel="stylesheet" href="/states.css">
</head>
<body>
  <!-- A card whose hover starts four effects: border color, shadow, and a glow on ::before and ::after. -->
  <a class="card" href="#card">Research card</a>
  <!-- A press: :active scales it down in 150ms; let go, it springs back. -->
  <p><button class="press" id="press">Press me</button></p>
  <!-- A footer whose motion is a looping background video. -->
  <footer class="foot"><video class="clouds" src="/clouds.webm" autoplay muted loop playsinline></video><p class="foot-text">Made with care</p></footer>
</body></html>
