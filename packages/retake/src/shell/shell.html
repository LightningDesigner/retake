<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Prototype</title>
    <style>/*CSS*/</style>
  </head>
  <body>
    <div id="wb-stage"><div id="wb-shield" hidden></div></div>
    <div id="wb-dock" role="region" aria-label="Retake timeline">
      <div class="divider" role="separator" aria-orientation="horizontal" aria-label="Resize the timeline"><span></span></div>
      <div class="head">
        <div class="left">
          <div class="transport">
            <button class="play" data-a="play" aria-label="Play">
              <svg class="i-play" viewBox="0 0 16 16" width="12" height="12"><path d="M5 3.4v9.2c0 .5.55.8.97.53l7.1-4.6a.63.63 0 0 0 0-1.06l-7.1-4.6A.63.63 0 0 0 5 3.4z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 16 16" width="12" height="12"><rect x="3.5" y="3" width="3" height="10" rx="1" fill="currentColor"/><rect x="9.5" y="3" width="3" height="10" rx="1" fill="currentColor"/></svg>
            </button>
            <span class="readout" aria-live="off"><b class="t">00:00.00</b><span class="phase">Live</span></span>
          </div>
        </div>
        <div class="hint" aria-live="polite"></div>
        <div id="wb-toast" role="status" hidden><span>Session cleared</span><button data-a="undo">Undo</button></div>
        <div class="right">
          <div class="tools" role="tablist" aria-label="Tool">
            <button class="tool" data-tool="hand" role="tab" aria-label="Hand">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
            </button>
            <button class="tool" data-tool="comment" role="tab" aria-label="Comment">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            </button>
          </div>
          <span class="notes-count" role="status" aria-label="No notes on this timeline" title="Notes on this timeline">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg>
            <span class="n">0</span>
          </span>
          <button class="btn fresh" data-a="fresh" aria-label="Start fresh" title="Start fresh">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            <span>Start fresh</span>
          </button>
        </div>
      </div>
      <div class="body">
        <div class="gutter" aria-label="Timelines"></div>
        <div class="track">
          <canvas class="lines" aria-label="Timeline"></canvas>
        </div>
      </div>
    </div>
    <button id="wb-fab" data-a="expand" aria-label="Show timeline" title="Show timeline (⌥T)" hidden>
      <!--MARK-->
      <i class="dot" aria-hidden="true"></i>
    </button>
    <div id="wb-tip" class="tip" hidden></div>
    <div id="wb-layers" hidden></div>
    <div id="wb-hl"></div>
    <div id="wb-scope"></div>
    <div id="wb-pins"></div>
    <div id="wb-note" class="card" hidden></div>
    <div id="wb-menu" class="card ctx" hidden></div>
    <script>/*CONFIG*/</script>
    <script>/*JS*/</script>
  </body>
</html>
