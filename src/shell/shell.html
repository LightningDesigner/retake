<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype</title>
    <style>/*CSS*/</style>
  </head>
  <body>
    <iframe id="wb-app" title="Prototype"></iframe>
    <div id="wb-dock" role="region" aria-label="Timeline">
      <div class="divider" title="Drag to resize"></div>
      <div class="bar">
        <button class="play" data-a="toggle" aria-label="Play"></button>
        <button class="icon" data-a="loop" aria-label="Loop a moment" title="Loop the last 3s · shift-drag the scrubber for any range">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>
        </button>
        <span class="time"></span>
        <div class="track" aria-label="Scrubber">
          <div class="lanes"></div>
          <div class="active-lane">
            <div class="band"><div class="past"></div><div class="future"></div></div>
          </div>
          <div class="loop-range"></div>
          <div class="pins"></div>
          <div class="head"></div>
          <div class="ghost"><span></span></div>
        </div>
        <button class="icon" data-a="comment" aria-label="Comment on an element" title="Comment on an element · or hold ⌘ and click">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        </button>
        <button class="notes-btn" data-a="notes" aria-label="Notes">Notes <b>0</b></button>
        <div class="menu-wrap">
          <button class="more" data-a="menu" aria-label="More">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
          <div class="menu" hidden>
            <div class="menu-title">Speed</div>
            <button data-rate="0.25">0.25×</button>
            <button data-rate="0.5">0.5×</button>
            <button data-rate="1">1×</button>
            <button data-rate="2">2×</button>
            <hr />
            <button data-a="start">Back to the beginning</button>
          </div>
        </div>
      </div>
    </div>
    <div id="wb-hl"></div>
    <div id="wb-pins"></div>
    <div id="wb-note" class="card" hidden></div>
    <div id="wb-notes" class="card" hidden></div>
    <script>/*CONFIG*/</script>
    <script>/*JS*/</script>
  </body>
</html>
