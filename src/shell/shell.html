<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype</title>
    <style>/*CSS*/</style>
  </head>
  <body>
    <div id="wb-stage"></div>
    <div id="wb-dock" role="region" aria-label="Timeline">
      <div class="divider" title="Drag to resize"></div>
      <div class="bar">
        <div class="side">
        <div class="group">
          <button class="tool rec" data-a="record" aria-label="Record" title="Record (⌥P)">
            <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg>
          </button>
          <button class="tool" data-a="pause" aria-label="Pause" title="Pause (⌥P)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="6.5" y="5.5" width="4" height="13" rx="1.2"/><rect x="13.5" y="5.5" width="4" height="13" rx="1.2"/></svg>
          </button>
        </div>
          <div class="group bare">
            <button class="tool" data-a="flag" aria-label="Add a marker" title="Drop a marker here (M)">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg>
            </button>
          </div>
        </div>
        <div class="timeline">
          <div class="track"><svg class="lines" aria-label="Timeline"></svg><span class="time"></span><button class="plus" aria-label="New timeline from here" hidden>+</button></div>
        </div>
        <div class="group tabs" role="tablist" aria-label="Tool">
          <button class="tool" data-tool="hand" role="tab" aria-label="Hand" title="Hand: just use the prototype">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
          </button>
          <button class="tool" data-tool="select" role="tab" aria-label="Select" title="Select a component to scrub it on its own">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.04 4.69a.5.5 0 0 1 .65-.65l16 6.5a.5.5 0 0 1-.06.95l-6.13 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.12a.5.5 0 0 1-.95.07z"/></svg>
          </button>
          <button class="tool" data-tool="comment" role="tab" aria-label="Comment" title="Comment on an element (or hold ⌘)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="wb-hl"></div>
    <div id="wb-scope"></div>
    <div id="wb-pins"></div>
    <div id="wb-note" class="card" hidden></div>
    <div id="wb-notes" class="card" hidden></div>
    <script>/*CONFIG*/</script>
    <script>/*JS*/</script>
  </body>
</html>
