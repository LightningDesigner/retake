<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype</title>
    <style>/*CSS*/</style>
  </head>
  <body>
    <div id="wb-stage"></div>
    <div id="wb-dock" role="region" aria-label="Timeline">
      <div class="divider" title="Drag to resize"></div>
      <div class="bar">
        <div class="stack">
          <button class="rec" data-a="record" aria-label="Record" title="Record (⌥P)"><span class="glyph"></span></button>
          <button class="icon" data-a="reset" aria-label="Reset" title="Reset: forget the timeline and start fresh">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          </button>
        </div>
        <div class="timeline">
          <div class="labels"></div>
          <div class="track"><svg class="lines" aria-label="Timeline"></svg><span class="time"></span></div>
        </div>
        <div class="stack">
          <button class="icon" data-a="select" aria-label="Select a component" title="Select a component to scrub it on its own">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l7 17 2.5-7.5L21 11z"/></svg>
          </button>
          <button class="icon" data-a="comment" aria-label="Comment" title="Comment on an element · or hold ⌘ and click">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="wb-hl"></div>
    <div id="wb-scope"></div>
    <div id="wb-pins"></div>
    <div id="wb-note" class="card" hidden></div>
    <div id="wb-notes" class="card" hidden></div>
    <script>/*CONFIG*/</script>
    <script>/*JS*/</script>
  </body>
</html>
