<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype</title>
    <style>/*CSS*/</style>
  </head>
  <body>
    <div id="wb-stage"></div>
    <div id="wb-dock" role="region" aria-label="Timeline">
      <div class="divider" title="Drag to resize"></div>
      <div class="bar">
        <button class="rec" data-a="record" aria-label="Record"><span class="dot"></span></button>
        <button class="icon" data-a="reset" aria-label="Reset" title="Reset: forget the timeline and start fresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <span class="time">00:00.00</span>
        <div class="track"><svg class="lines" aria-label="Timeline"></svg></div>
        <span class="scope" hidden></span>
        <button class="icon" data-a="select" aria-label="Select a component" title="Select a component to scrub it on its own">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l7 17 2.5-7.5L21 11z"/></svg>
        </button>
        <button class="icon" data-a="comment" aria-label="Comment" title="Comment on an element · or hold ⌘ and click">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        </button>
        <button class="notes-btn" data-a="notes" aria-label="Notes">Notes <b>0</b></button>
      </div>
    </div>
    <div id="wb-hl"></div>
    <div id="wb-scope"></div>
    <div id="wb-pins"></div>
    <div id="wb-note" class="card" hidden></div>
    <div id="wb-notes" class="card" hidden></div>
    <script>/*CONFIG*/</script>
    <script>/*JS*/</script>
  </body>
</html>
